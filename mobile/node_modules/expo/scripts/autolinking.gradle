def findNodeBin = { ->
  def candidates = ["/opt/homebrew/bin/node", "/usr/local/bin/node", System.getenv("NODE_BINARY"), "node"].findAll { it != null }
  for (c in candidates) { if (new File(c).exists()) return c }
  return "node"
}
def autolinkingPath = [findNodeBin(), "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"]

apply from: new File(
  providers.exec {
    workingDir(rootDir)
    commandLine(autolinkingPath)
  }.standardOutput.asText.get().trim(), 
  "../scripts/android/autolinking_implementation.gradle"
)
